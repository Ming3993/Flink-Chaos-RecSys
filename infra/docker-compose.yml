services:
  # ==========================================================
  # DATA PLANE: REDPANDA + CONSOLE + REDIS
  # ==========================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.10
    container_name: redpanda
    profiles: ["all", "data"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://${HOST_IP:-127.0.0.1}:9092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://${HOST_IP:-127.0.0.1}:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "9092:9092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    profiles: ["all", "data"]
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:29092"]
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis
    profiles: ["all", "data"]
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ==========================================================
  # COMPUTE PLANE: APACHE FLINK (PYFLINK)
  # ==========================================================
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: flink-chaos-pyflink:1.19.1
    container_name: flink-jobmanager
    profiles: ["all", "flink"]
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        state.backend.type: hashmap
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - ../src/flink_jobs:/opt/flink/jobs
      - flink_checkpoints:/opt/flink/checkpoints
    restart: unless-stopped

  flink-taskmanager:
    image: flink-chaos-pyflink:1.19.1
    container_name: flink-taskmanager
    profiles: ["all", "flink"]
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-2}
        taskmanager.memory.process.size: 2048m
        state.backend.type: hashmap
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - ../src/flink_jobs:/opt/flink/jobs
      - flink_checkpoints:/opt/flink/checkpoints
    restart: unless-stopped

volumes:
  redpanda_data:
  redis_data:
  flink_checkpoints:
